# Tiny Tapeout project information
project:
  title:        "TinyNPU 3x3 - Educational"
  author:       "Marius LEPERE"
  discord:      "carjaguar"
  description:  "Explainable 3x3 hardware NPU exposing internal MAC scores for educational purposes."
  language:     "Verilog"
  clock_hz:     0       # Design purement combinatoire

  # How many tiles your design occupies?
  tiles: "1x1"

  # Your top module name must start with "tt_um_":
  top_module:  "tt_um_npu_MariusL00"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs : Les 8 premiers pixels de la matrice 3x3
  ui[0]: "Pixel 0"
  ui[1]: "Pixel 1"
  ui[2]: "Pixel 2"
  ui[3]: "Pixel 3"
  ui[4]: "Pixel 4"
  ui[5]: "Pixel 5"
  ui[6]: "Pixel 6"
  ui[7]: "Pixel 7"

  # Outputs : Division du bus pour la télémétrie éducative (3 bits ID + 5 bits Score)
  uo[0]: "Prediction ID [Bit 0 / LSB]"
  uo[1]: "Prediction ID [Bit 1]"
  uo[2]: "Prediction ID [Bit 2 / MSB]"
  uo[3]: "Max MAC Score [Bit 0 / LSB]"
  uo[4]: "Max MAC Score [Bit 1]"
  uo[5]: "Max MAC Score [Bit 2]"
  uo[6]: "Max MAC Score [Bit 3]"
  uo[7]: "Max MAC Score [Bit 4 / Signe]"

  # Bidirectional pins : Utilisées ici comme ENTRÉES
  uio[0]: "Pixel 8 (Le 9ème pixel de la matrice)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
