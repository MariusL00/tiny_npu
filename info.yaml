# Tiny Tapeout project information
project:
  title:        "Tiny NPU"
  author:       "Marius LEPERE"
  discord:      "carjaguar"
  description:  "Tiny NPU to find if the user put an horizontal or a vertical line (hello world of AI)"
  language:     "Verilog"
  clock_hz:     0       # 0 car le design est purement combinatoire (pas d'horloge)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_npu_MariusL00"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs (Les 4 switches pour dessiner le motif)
  ui[0]: "Pixel 0 (Bas-Droite)"
  ui[1]: "Pixel 1 (Haut-Droite)"
  ui[2]: "Pixel 2 (Bas-Gauche)"
  ui[3]: "Pixel 3 (Haut-Gauche)"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs (La prédiction et les scores internes extraits pour l'écran OLED)
  uo[0]: "Prediction (1=Classe A Vertical, 0=Classe B Horizontal)"
  uo[1]: "Max Vertical Score [Bit 0]"
  uo[2]: "Max Vertical Score [Bit 1]"
  uo[3]: "Max Vertical Score [Bit 2 / Signe]"
  uo[4]: "Max Horizontal Score [Bit 0]"
  uo[5]: "Max Horizontal Score [Bit 1]"
  uo[6]: "Max Horizontal Score [Bit 2 / Signe]"
  uo[7]: ""

  # Bidirectional pins (Non utilisées pour cette première version sans UART)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
