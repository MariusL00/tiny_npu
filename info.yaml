# Tiny Tapeout project information
project:
  title:        "TinyNPU 3x3"
  author:       "Marius LEPERE"
  discord:      "carjaguar"
  description:  "Explainable 3x3 hardware NPU with spatial invariance (Max Pooling) to classify lines and export internal scores."
  language:     "Verilog"
  clock_hz:     0       # Design purement combinatoire

  # How many tiles your design occupies?
  tiles: "1x1"

  # Your top module name must start with "tt_um_":
  top_module:  "tt_um_npu_MariusL00"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs : Les 8 premiers pixels de la matrice 3x3
  ui[0]: "Pixel 0"
  ui[1]: "Pixel 1"
  ui[2]: "Pixel 2"
  ui[3]: "Pixel 3"
  ui[4]: "Pixel 4"
  ui[5]: "Pixel 5"
  ui[6]: "Pixel 6"
  ui[7]: "Pixel 7"

  # Outputs : Prédiction (0-4) et le Score sélectionné (5 bits signés)
  uo[0]: "Prediction [Bit 0]"
  uo[1]: "Prediction [Bit 1]"
  uo[2]: "Prediction [Bit 2]"
  uo[3]: "Selected Score [Bit 0 / LSB]"
  uo[4]: "Selected Score [Bit 1]"
  uo[5]: "Selected Score [Bit 2]"
  uo[6]: "Selected Score [Bit 3]"
  uo[7]: "Selected Score [Bit 4 / Signe]"

  # Bidirectional pins : Utilisées ici comme ENTRÉES
  uio[0]: "Pixel 8 (Le 9ème pixel de la matrice)"
  uio[1]: "MUX Select [Bit 0] (00=H, 01=V, 10=D1, 11=D2)"
  uio[2]: "MUX Select [Bit 1]"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
